name: Deploy Signed Repository to GitHub Pages

on:
  workflow_run:
    workflows: ["Build and Test Flatpak"]
    types:
      - completed
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sign-and-deploy:
    name: Sign Repository and Deploy to Pages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ostree
          
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && '17276907343' || github.event.workflow_run.id }}
          
      - name: Check and fix repository structure
        run: |
          echo "Repository contents after download:"
          ls -la repo/
          echo "Repository structure:"
          find repo/ -type d | head -20
          
          # The artifact may be extracted with an extra directory level
          if [ -d "repo/repo" ]; then
            echo "Moving repo/repo/* to repo/"
            mv repo/repo/* repo/
            rmdir repo/repo
          fi
          
          echo "Final repository structure:"
          find repo/ -type d | head -10
          
          echo "Checking for OSTree repository structure:"
          ls -la repo/
          echo "Looking for refs directory:"
          find repo/ -name "refs" -type d
          echo "Contents of refs if it exists:"
          if [ -d "repo/refs" ]; then
            find repo/refs/ -type d
            ls -la repo/refs/ 2>/dev/null || echo "refs directory empty or inaccessible"
            
            # Create refs/remotes directory if missing (required by OSTree)
            if [ ! -d "repo/refs/remotes" ]; then
              echo "Creating missing refs/remotes directory"
              mkdir -p repo/refs/remotes
            fi
          fi
          
          echo "Checking for config file:"
          if [ -f "repo/config" ]; then
            echo "OSTree config exists"
            cat repo/config
          else
            echo "No OSTree config found"
          fi
          
          echo "Testing ostree commands:"
          ostree refs --repo=repo || echo "Failed to list refs"
          ostree summary --view --repo=repo || echo "Failed to view summary"
          
      - name: Generate Pages content from signed repository
        env:
          FLATPAK_GPG_PUBLIC_KEY: ${{ secrets.FLATPAK_GPG_PUBLIC_KEY }}
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python3 scripts/pages_publisher_simple.py
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages-content
          
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sign-and-deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4