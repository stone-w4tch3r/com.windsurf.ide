name: Deploy Signed Repository to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Flatpak Repository
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Validate Windsurf manifest
        run: |
          python -m scripts.main validate com.windsurf.ide.yaml --windsurf
          
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          
      - name: Add Flathub repository
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          
      - name: Extract SDK versions from manifest
        id: sdk-versions
        run: |
          SDK_VERSION=$(grep "runtime-version:" com.windsurf.ide.yaml | awk '{print $2}' | tr -d "'")
          BASE_VERSION=$(grep "base-version:" com.windsurf.ide.yaml | awk '{print $2}' | tr -d "'")
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          
      - name: Install SDK and runtime
        run: |
          sudo flatpak install -y flathub org.freedesktop.Sdk//${{ steps.sdk-versions.outputs.sdk_version }}
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp//${{ steps.sdk-versions.outputs.base_version }}
          
      - name: Build Flatpak
        run: |
          # Use container-friendly build settings
          flatpak-builder --disable-rofiles-fuse --repo=repo --force-clean build-dir com.windsurf.ide.yaml
          
      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          retention-days: 1

  sign-and-deploy:
    name: Sign Repository and Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ostree
          
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          
      - name: Sign repository and generate Pages content
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PUBLIC_KEY: ${{ secrets.FLATPAK_GPG_PUBLIC_KEY }}
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python3 scripts/pages_publisher.py
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages-content
          
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sign-and-deploy
    
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4