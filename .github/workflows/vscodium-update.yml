name: VSCodium Flatpak Update

on:
  schedule:
    # Check for VSCodium updates daily
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Allow manual triggering
  repository_dispatch:
    # Allow external triggering
    types: [vscodium-update]

jobs:
  check-vscodium-update:
    name: Check for VSCodium Flatpak Updates
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Check for VSCodium updates
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          python -m scripts.main check-vscodium
          
      - name: Output result
        run: |
          echo "VSCodium update check completed"