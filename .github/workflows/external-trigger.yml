name: External Update Triggers

on:
  # Listen for webhooks from external sources
  repository_dispatch:
    types: [external-update]

jobs:
  process-external-trigger:
    name: Process External Update Trigger
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Determine update type
        id: update-type
        run: |
          # Parse the client_payload to determine what to update
          UPDATE_TYPE="${{ github.event.client_payload.type }}"
          
          case "$UPDATE_TYPE" in
            "windsurf")
              echo "type=windsurf" >> $GITHUB_OUTPUT
              ;;
            "vscodium")
              echo "type=vscodium" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "type=both" >> $GITHUB_OUTPUT
              ;;
          esac
      
      - name: Check Windsurf updates
        if: steps.update-type.outputs.type == 'windsurf' || steps.update-type.outputs.type == 'both'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          python -m scripts.main check-windsurf
      
      - name: Check VSCodium updates
        if: steps.update-type.outputs.type == 'vscodium' || steps.update-type.outputs.type == 'both'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          python -m scripts.main check-vscodium