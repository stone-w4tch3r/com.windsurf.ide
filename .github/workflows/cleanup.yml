name: Cleanup Orphaned Resources

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:
    # Allow manual triggering

jobs:
  cleanup:
    name: Cleanup Orphaned Branches
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete orphaned windsurf branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete windsurf-update branches with no associated open PR
          echo "Checking for orphaned windsurf branches..."

          # Get all windsurf branches
          BRANCHES=$(gh api repos/${{ github.repository }}/git/refs/heads --jq '.[].ref' | grep 'update-windsurf' || true)

          if [ -z "$BRANCHES" ]; then
            echo "No windsurf branches found"
          else
            echo "$BRANCHES" | while read -r branch_ref; do
              branch_name=$(echo "$branch_ref" | sed 's|refs/heads/||')

              # Check if there's an open PR for this branch
              PR_COUNT=$(gh pr list --head "$branch_name" --state open --json number --jq '. | length' 2>/dev/null || echo "0")

              if [ "$PR_COUNT" -eq 0 ]; then
                echo "Deleting orphaned branch: $branch_name"
                gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$branch_name" || true
              fi
            done
          fi

      - name: Delete orphaned vscodium branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete vscodium-update branches with no associated open PR
          echo "Checking for orphaned vscodium branches..."

          # Get all vscodium branches
          BRANCHES=$(gh api repos/${{ github.repository }}/git/refs/heads --jq '.[].ref' | grep 'vscodium-update' || true)

          if [ -z "$BRANCHES" ]; then
            echo "No vscodium branches found"
          else
            echo "$BRANCHES" | while read -r branch_ref; do
              branch_name=$(echo "$branch_ref" | sed 's|refs/heads/||')

              # Check if there's an open PR for this branch
              PR_COUNT=$(gh pr list --head "$branch_name" --state open --json number --jq '. | length' 2>/dev/null || echo "0")

              if [ "$PR_COUNT" -eq 0 ]; then
                echo "Deleting orphaned branch: $branch_name"
                gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$branch_name" || true
              fi
            done
          fi

      - name: Summary
        run: |
          echo "Cleanup completed"
