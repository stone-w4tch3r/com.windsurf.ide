name: Build and Test Flatpak

on:
  pull_request:
    paths:
      - 'com.windsurf.ide.yaml'
      - 'com.windsurf.ide.metainfo.xml'
      - 'assets/**'
      - 'windsurf.sh'
      - '*.conf'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Manifest
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Validate Windsurf manifest
        run: |
          python -m scripts.main validate com.windsurf.ide.yaml --windsurf

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    container:
      image: ghcr.io/andyholmes/flatter/gnome:master
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Setup GPG
        if: ${{ github.event_name != 'pull_request' }}
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
      
      - name: Build Flatpak with Flatter action
        uses: andyholmes/flatter@main
        with:
          files: com.windsurf.ide.yaml
          gpg-sign: ${{ steps.gpg.outputs.fingerprint || '' }}
          flatpak-builder-args: --install-deps-from=flathub
          
      - name: Extract repository from build
        run: |
          # Flatter creates repo and bundles in specific locations
          ls -la
          echo "Looking for repository and bundles:"
          find . -name "repo" -type d 2>/dev/null || echo "No repo directory found"
          find . -name "*.flatpak" 2>/dev/null || echo "No flatpak bundle found"
          
          # Flatter should create the repo directory automatically
          if [ -d "repo" ]; then
            echo "Repository found at repo/"
          else
            echo "Error: No repository created by Flatter"
            exit 1
          fi
          
      - name: Test installation
        run: |
          # Install from local repository
          flatpak --user remote-add --no-gpg-verify windsurf-repo repo
          flatpak --user install --assumeyes windsurf-repo com.windsurf.ide
          
      - name: Test basic functionality
        run: |
          # Test version command
          timeout 30s flatpak --user run com.windsurf.ide --version || true
          
          # Test help command  
          timeout 30s flatpak --user run com.windsurf.ide --help || true
          
      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          flatpak --user uninstall --assumeyes com.windsurf.ide || true
          flatpak --user remote-delete windsurf-repo || true

  auto-merge:
    name: Auto-merge Windsurf Updates
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'windsurf-update') &&
      contains(github.event.pull_request.labels.*.name, 'automated')
    
    steps:
      - name: Auto-merge PR
        uses: pascalgn/merge-action@v0.15.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: squash
          merge_commit_message: pull-request-title-and-description