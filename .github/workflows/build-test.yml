name: Build and Test Flatpak

on:
  pull_request:
    paths:
      - 'com.windsurf.ide.yaml'
      - 'assets/**'
      - 'windsurf.sh'
      - '*.conf'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Manifest
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Validate Windsurf manifest
        run: |
          python -m scripts.main validate com.windsurf.ide.yaml --windsurf

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Build Flatpak with official action
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.windsurf.ide.flatpak
          manifest-path: com.windsurf.ide.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          
      - name: Extract repository from build
        run: |
          # The flatpak-builder action creates a repo directory
          ls -la
          if [ -d "repo" ]; then
            echo "Repository found at repo/"
          elif [ -d ".flatpak-builder/repo" ]; then
            echo "Moving repository from .flatpak-builder/repo to repo/"
            mv .flatpak-builder/repo repo
          else
            echo "Looking for repository location:"
            find . -name "repo" -type d 2>/dev/null || echo "No repo directory found"
            find . -name "*.flatpak" 2>/dev/null || echo "No flatpak bundle found"
            exit 1
          fi
          
      - name: Test installation
        run: |
          # Install from local repository
          flatpak --user remote-add --no-gpg-verify windsurf-repo repo
          flatpak --user install --assumeyes windsurf-repo com.windsurf.ide
          
      - name: Test basic functionality
        run: |
          # Test version command
          timeout 30s flatpak --user run com.windsurf.ide --version || true
          
          # Test help command  
          timeout 30s flatpak --user run com.windsurf.ide --help || true
          
      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          flatpak --user uninstall --assumeyes com.windsurf.ide || true
          flatpak --user remote-delete windsurf-repo || true

  auto-merge:
    name: Auto-merge Windsurf Updates
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'windsurf-update') &&
      contains(github.event.pull_request.labels.*.name, 'automated')
    
    steps:
      - name: Auto-merge PR
        uses: pascalgn/merge-action@v0.15.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: squash
          merge_commit_message: pull-request-title-and-description