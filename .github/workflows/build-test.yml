name: Build and Test Flatpak

on:
  pull_request:
    paths:
      - 'com.windsurf.ide.yaml'
      - 'assets/**'
      - 'windsurf.sh'
      - '*.conf'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Manifest
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Validate Windsurf manifest
        run: |
          python -m scripts.main validate com.windsurf.ide.yaml --windsurf

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          
      - name: Add Flathub repository
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          
      - name: Extract SDK versions from manifest
        id: sdk-versions
        run: |
          SDK_VERSION=$(grep "runtime-version:" com.windsurf.ide.yaml | awk '{print $2}' | tr -d "'")
          BASE_VERSION=$(grep "base-version:" com.windsurf.ide.yaml | awk '{print $2}' | tr -d "'")
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          
      - name: Install SDK and runtime
        run: |
          sudo flatpak install -y flathub org.freedesktop.Sdk//${{ steps.sdk-versions.outputs.sdk_version }}
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp//${{ steps.sdk-versions.outputs.base_version }}
          
      - name: Build Flatpak
        run: |
          # Use container-friendly build settings
          flatpak-builder --disable-rofiles-fuse --repo=repo --force-clean build-dir com.windsurf.ide.yaml
          
      - name: Test installation
        run: |
          # Install from local repository
          flatpak --user remote-add --no-gpg-verify windsurf-repo repo
          flatpak --user install --assumeyes windsurf-repo com.windsurf.ide
          
      - name: Test basic functionality
        run: |
          # Test version command
          timeout 30s flatpak --user run com.windsurf.ide --version || true
          
          # Test help command
          timeout 30s flatpak --user run com.windsurf.ide --help || true
          
      - name: Clean up
        if: always()
        run: |
          flatpak --user uninstall --assumeyes com.windsurf.ide || true
          flatpak --user remote-delete windsurf-repo || true

  auto-merge:
    name: Auto-merge Windsurf Updates
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'windsurf-update') &&
      contains(github.event.pull_request.labels.*.name, 'automated')
    
    steps:
      - name: Auto-merge PR
        uses: pascalgn/merge-action@v0.15.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: squash
          merge_commit_message: pull-request-title-and-description